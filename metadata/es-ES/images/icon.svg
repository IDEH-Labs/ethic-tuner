<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Acoustic Sound Resonance Waves -->
        <path d="M 175 180 A 65 65 0 0 1 175 280" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
        <path d="M 150 160 A 95 95 0 0 1 150 300" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
        <path d="M 337 180 A 65 65 0 0 0 337 280" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
        <path d="M 362 160 A 95 95 0 0 0 362 300" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
        
        <!-- Tuning Fork (Diapasón) in Pure Brilliant White -->
        <!-- Left Prong -->
        <rect x="214" y="140" width="22" height="120" rx="11" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        <!-- Right Prong -->
        <rect x="276" y="140" width="22" height="120" rx="11" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        <!-- Base U-Curve connecting prongs -->
        <path d="M 214 240 C 214 290 298 290 298 240 L 276 240 C 276 270 236 270 236 240 Z" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        <!-- Stem & Handle -->
        <rect x="245" y="278" width="22" height="70" rx="8" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        <circle cx="256" cy="358" r="18" fill="#FFFFFF" filter="url(#drop-shadow)"/>
        <circle cx="256" cy="358" r="9" fill="#0d9488"/>
        
        <!-- Frequency Tuning Wave / Pitch Indicator (440 Hz Golden Accent) -->
        <path d="M 230 130 C 242 120 270 120 282 130" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round"/>
        
</svg>